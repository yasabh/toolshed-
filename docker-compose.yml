name: toolshed

services:
  toolshed:
    build: .
    # Named explicitly, or compose derives "toolshed-toolshed" from the project
    # and service names — the same word twice, and not what the gateway calls it.
    image: toolshed:latest
    networks: [edge]          # gateway reaches us here; no `ports:` — ever
    restart: unless-stopped
    environment:
      # Where this is deployed, not a property of the image — and the only
      # place it is set. The image installs tzdata so this resolves; alpine
      # ships none, and a TZ with no data behind it silently means UTC.
      TZ: Europe/Budapest
    # Nothing heavy runs here — Ghostscript moved into the browser — so these
    # bound a process that renders three templates and serves static files.
    # No `mem_limit`: this host's kernel carries `cgroup_disable=memory`,
    # so docker discards it with a warning, and a control that is not enforced is
    # worse than none because it reads like one.
    pids_limit: 128
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    external: true            # docker network create edge (already exists on the host)
