# gatekeeper's block, reproduced as faithfully as it can be without TLS or
# `auth`. Everything that matters is copied from gatekeeper/gateway/default.conf:
# the variable proxy_pass host, the explicit rewrite it forces, the injected
# badge, and X-Forwarded-Prefix.
#
# Two prefixes are mounted on purpose. CLAUDE.md says `/tools/`, the access
# contract says `/toolshed/`, and the app reads whichever the gateway sends —
# serving both here is what proves that rather than asserting it.

# The badge belongs on the tool list and nowhere else. Matched on $request_uri
# because the location rewrites $uri to strip the prefix before the filter runs.
# gatekeeper puts this on the TV *list* page only. toolshed's own root is a
# redirect with no body, so the page that would carry it here is a tool page —
# which of them is a gatekeeper-side choice. What this app owes either way is a
# document that closes with </body> for the filter to substitute into, and that
# is what the assertion downstream is really checking.
map $request_uri $whoami_tag {
    default                        "";
    "~^/(tools|toolshed)/pdf(\?|$)" "<script src=\"/_whoami.js\" defer></script>";
}

server {
    # Plain HTTP, both legs. TLS terminates at the real gatekeeper's front door
    # and never reaches this app, so there is nothing here for a certificate to
    # prove.
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Must be at least the app's own cap, or nginx refuses the upload first with
    # its own error page instead of the app's message.
    client_max_body_size 120m;

    # The trap. On the real gateway this namespace belongs to tv-webui's
    # catch-all `location /`, which is why an unprefixed request from this app
    # would not 404 in production — it would quietly land somewhere else. Here
    # it is a status nothing else returns, so a leak cannot be mistaken for
    # anything but a leak.
    location / { return 418; }

    location = /tools    { return 302 /tools/; }
    location = /toolshed { return 302 /toolshed/; }

    location /tools/ {
        # sub_filter reads the response body, so it has to arrive uncompressed.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter "</body>" "$whoami_tag</body>";

        # proxy_pass's host is a variable (forces per-request DNS re-resolution),
        # which disables nginx's automatic prefix-replacement — a trailing slash
        # alone does NOT strip the prefix in that case. Strip it explicitly.
        set $toolshed toolshed;
        rewrite ^/tools/(.*)$ /$1 break;
        proxy_pass http://$toolshed:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tools;
        # Overwritten on every hop, so a client can never forge it.
        proxy_set_header X-Auth-User       "";
    }

    # A second copy of the same image, run with no Ghostscript slots at all, so
    # the queue-timeout path is reachable deterministically instead of by racing
    # real uploads against each other.
    location /busy/ {
        set $busy toolshed-busy;
        rewrite ^/busy/(.*)$ /$1 break;
        proxy_pass http://$busy:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /busy;
        proxy_set_header X-Auth-User       "";
    }

    location /toolshed/ {
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter "</body>" "$whoami_tag</body>";

        set $toolshed2 toolshed;
        rewrite ^/toolshed/(.*)$ /$1 break;
        proxy_pass http://$toolshed2:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /toolshed;
        proxy_set_header X-Auth-User       "";
    }
}
